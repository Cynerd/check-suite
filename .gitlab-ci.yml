stages:
  - devenv
  - build
  - test
  - lint
  - style
  - coverage
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  GIT_DEPTH: 0

.nix:
  image: registry.gitlab.com/cynerd/gitlab-ci-nix
  tags:
    - docker
  cache:
    key: "nix"
    paths:
      - ".nix-cache"
  before_script:
    - gitlab-ci-nix-cache-before
  after_script:
    - gitlab-ci-nix-cache-after

## Development environment #####################################################
devenv:
  stage: devenv
  extends: .nix
  script:
    - nix develop -c true
    - nix develop .#musl -c true

.musl:
  variables:
    NIXATTR: .#musl

## Build stage #################################################################
.build:
  stage: build
  extends: .nix
  needs: ["devenv"]

build:
  extends: .build
  script:
    - nix develop --quiet $NIXATTR -c meson setup build -Doptimization=plain $SETUP_ARGS
    - nix develop --quiet $NIXATTR -c meson compile -C build
  artifacts:
    expire_in: 1 week
    paths:
    - 'build/'

build:musl:
  extends: ["build", ".musl"]

build-werror:
  extends: build
  needs:
    - job: build
      artifacts: false
  allow_failure: true
  variables:
    SETUP_ARGS: --werror

build-werror:musl:
  extends: ["build-werror", ".musl"]
  needs:
    - job: build:musl
      artifacts: false

nix:
  stage: build
  extends: .nix
  script:
    - nix build $NIXATTR

nix:musl:
  extends: ["nix", ".musl"]

## Test stage ##################################################################
.test:
  stage: test
  extends: .nix
  needs: ["devenv"]

.test-meson:
  extends: .test
  script:
    - ulimit -n 1024 # workaround for Valgrind
    - nix develop --quiet -c meson setup build -Doptimization=plain $SETUPARG
    - nix develop --quiet -c meson test -C build --print-errorlogs $TESTARG
  artifacts:
    when: always
    paths:
      - 'build/'

tests:
  extends: .test-meson
  needs:
    - job: build
      artifacts: false
  variables:
    SETUPARG: -Db_coverage=true # Used in coverage job
  artifacts:
    reports:
      junit: 'build/meson-logs/testlog.junit.xml'

tests:musl:
  extends: ["tests", ".musl"]
  needs:
    - job: build:musl
      artifacts: false
  allow_failure: true

.test-valgrind:
  extends: tests
  needs:
    - job: tests
      artifacts: false

valgrind:memcheck:
  extends: .test-valgrind
  variables:
    VALGRIND: memcheck

valgrind:helgrind:
  extends: .test-valgrind
  variables:
    VALGRIND: helgrind

valgrind:drd:
  extends: .test-valgrind
  variables:
    VALGRIND: drd

nix-check:
  extends: .test
  needs:
    - job: nix
      artifacts: false
  script:
    - nix flake check

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

## Lint stage ##################################################################
.linter:
  stage: lint
  extends: .nix
  needs: ["devenv"]
  allow_failure: true

muon-analyze:
  extends: .linter
  script:
    - nix run --quiet .#muon -- analyze

clang-tidy:
  extends: .linter
  needs: ["build"]
  script:
    - nix develop --quiet -c ninja -C build clang-tidy

shellcheck:
  extends: .linter
  script:
    - git ls-files '**.sh' | xargs nix run --quiet .#shellcheck

statix:
  extends: .linter
  script:
      - nix run --quiet .#statix -- check .

## Code Style stage ############################################################
.style:
  stage: style
  extends: .nix
  needs: ["devenv"]
  allow_failure: true

muon:
  extends: .style
  script:
    - |
      git ls-files '**/meson.build' meson_options.txt |
        xargs nix run --quiet .#muon -- fmt -e -i
    - git diff --exit-code

clang-format:
  extends: .style
  needs: ["build"]
  script:
    - nix develop --quiet -c ninja -C build clang-format
    - git diff --exit-code

shell-format:
  extends: .style
  script:
    - git ls-files '**.sh' '**.bats' | xargs nix run --quiet .#shfmt -- -d

nixfmt:
  extends: .style
  script:
    - nix fmt .
    - git diff --exit-code

deadnix:
  extends: .style
  script:
    - nix run --quiet .#deadnix -- --fail .

editorconfig-checker:
  extends: .style
  script:
    - nix run --quiet .#editorconfig-checker -- -exclude '.nix-cache/.*'

gitlint:
  extends: .style
  script:
    - git fetch
    - nix run --quiet .#gitlint -- --commits origin/master..$CI_COMMIT_SHA

## Code Coverage stage #########################################################
coverage:
  stage: coverage
  extends: .nix
  needs: ["tests"]
  script:
    - nix develop --quiet -c ninja -j1 -C build coverage-html coverage-xml
    - mv build/meson-logs/coveragereport ./
  coverage: '/lines\.\.\.\.\.\.: (\d+.\d+%)/'
  artifacts:
    expire_in: 1 month
    expose_as: 'Code Coverage'
    paths:
    - 'coveragereport/'
    reports:
      coverage_report:
        coverage_format: cobertura
        path: 'build/meson-logs/coverage.xml'


## Release creation ############################################################
release:
  stage: release
  extends: .nix
  rules:
    - if: '$CI_COMMIT_TAG'
  needs:
    - job: tests
      artifacts: false
    - job: tests:musl
      artifacts: false
  script:
    - nix develop --quiet -c ./release.sh
